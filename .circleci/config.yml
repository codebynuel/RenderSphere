version: 2.1

jobs:
  deploy-modal-renderer:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Check for [modal-release] in commit message
          command: |
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if [[ "$COMMIT_MSG" != *"[modal-release]"* ]]; then
              echo "Commit message does not contain [modal-release], skipping deployment"
              circleci step halt
            fi
            echo "Found [modal-release], proceeding with Modal deployment"
      - run:
          name: Install Modal CLI
          command: python -m pip install -r requirements-modal.txt
      - run:
          name: Deploy Modal renderer
          command: python -m modal deploy modal_app.py

workflows:
  deploy-renderer:
    jobs:
      - deploy-modal-renderer
